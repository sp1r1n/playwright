name: Bug report
description: Something in the framework does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command you ran and, if it helps, the smallest spec that shows it.
      render: shell
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: 'Node 20.11, Playwright 1.50, macOS 15'
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      render: shell
